<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kali-lab console</title>
<style>
  :root{
    --bg:#1b1d22; --panel:#23262d; --panel2:#2b2f37; --line:#363b44;
    --fg:#e6e8ec; --mut:#9aa3af; --accent:#4f8cff; --ok:#3fb950; --warn:#d29922;
    --bad:#f85149; --radius:8px; font-size:15px;
  }
  @media (prefers-color-scheme: light){
    :root{--bg:#f3f4f6;--panel:#fff;--panel2:#f0f2f5;--line:#dce0e6;--fg:#1b1d22;--mut:#5c6673;}
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
       background:var(--bg);color:var(--fg);height:100vh;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);
         border-bottom:1px solid var(--line)}
  header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.2px}
  header .sp{flex:1}
  button{font:inherit;color:var(--fg);background:var(--panel2);border:1px solid var(--line);
          padding:6px 12px;border-radius:6px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
  button.danger:hover{border-color:var(--bad);color:var(--bad)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .layout{flex:1;display:flex;min-height:0}
  aside{width:250px;background:var(--panel);border-right:1px solid var(--line);
        display:flex;flex-direction:column;overflow:auto}
  .side-h{padding:10px 14px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
  .vm{display:flex;align-items:center;gap:9px;padding:9px 14px;cursor:pointer;border-left:3px solid transparent}
  .vm:hover{background:var(--panel2)}
  .vm.sel{background:var(--panel2);border-left-color:var(--accent)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--mut);flex:none}
  .dot.running{background:var(--ok)} .dot.shut{background:var(--mut)} .dot.paused{background:var(--warn)}
  .vm .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .vm .st{font-size:11px;color:var(--mut)}
  main{flex:1;overflow:auto;padding:18px 22px;min-width:0}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
  .tab{padding:8px 14px;cursor:pointer;border-bottom:2px solid transparent;color:var(--mut)}
  .tab.sel{color:var(--fg);border-bottom-color:var(--accent)}
  h2{font-size:17px;margin:0 0 4px} .sub{color:var(--mut);margin:0 0 16px;font-size:13px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px}
  .card h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--mut);font-weight:500}
  .kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;font-size:14px}
  .kv div.k{color:var(--mut)}
  code,pre{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--line);
      border-radius:6px;padding:10px;font-size:12.5px;max-height:none;overflow:auto;margin:0}
  input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);
         border-radius:6px;padding:6px 9px}
  textarea{width:100%;min-height:420px;resize:vertical;font-family:ui-monospace,monospace;font-size:12.5px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
  label{font-size:13px;color:var(--mut);min-width:84px}
  .pill{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--panel2);color:var(--mut)}
  .pill.running{color:var(--ok)} .pill.paused{color:var(--warn)}
  .empty{color:var(--mut);padding:40px;text-align:center}
  /* modal */
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:20}
  .ov.on{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;width:min(560px,92vw);max-height:88vh;overflow:auto}
  .modal h3{margin:0 0 14px}
  .modal .row label{min-width:120px}
  .modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
  /* console drawer */
  .console{position:fixed;right:0;bottom:0;width:min(640px,96vw);max-height:60vh;background:var(--panel);
           border:1px solid var(--line);border-top-left-radius:10px;box-shadow:0 -4px 24px rgba(0,0,0,.3);
           display:none;flex-direction:column;z-index:15}
  .console.on{display:flex}
  .console .ch{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}
  .console pre{border:0;border-radius:0;flex:1;overflow:auto}
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--panel2);
         border:1px solid var(--line);padding:10px 16px;border-radius:8px;z-index:30;display:none}
  .toast.on{display:block}
  .spin{display:inline-block;width:12px;height:12px;border:2px solid var(--mut);border-top-color:var(--accent);
        border-radius:50%;animation:s .7s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  @media (max-width:720px){aside{width:160px}.kv{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>🖧 kali-lab console</h1>
  <span class="pill">VirtualBox-style control panel</span>
  <span class="sp"></span>
  <button onclick="openNew()">＋ New VM</button>
  <button onclick="showProfiles()">Profiles</button>
  <button onclick="refresh()">⟳ Refresh</button>
  <button onclick="toggleConsole()">Console</button>
</header>

<div class="layout">
  <aside>
    <div class="side-h">Virtual machines</div>
    <div id="vmlist"></div>
  </aside>
  <main id="main"><div class="empty">Select a VM on the left, or create one.</div></main>
</div>

<!-- generic modal -->
<div class="ov" id="ov"><div class="modal" id="modal"></div></div>

<!-- console drawer -->
<div class="console" id="con">
  <div class="ch"><strong id="conTitle">Console</strong><span id="conState"></span>
    <span class="sp" style="flex:1"></span>
    <button onclick="toggleConsole()">Close</button></div>
  <pre id="conLog">No job yet.</pre>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const api = async (m, path, body) => {
  const o = {method:m, headers:{}};
  if(body){o.headers["Content-Type"]="application/json";o.body=JSON.stringify(body);}
  const r = await fetch(path, o);
  try{return await r.json();}catch(e){return {error:"bad response"};}
};
const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let state = {vms:[], sel:null, detail:null, tab:"overview", view:"vm", jobTimer:null, net:null};

function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),2600);}
function closeModal(){$("#ov").classList.remove("on");$("#modal").innerHTML="";}
function modal(html){$("#modal").innerHTML=html;$("#ov").classList.add("on");}
$("#ov").addEventListener("click",e=>{if(e.target.id==="ov")closeModal();});

// ---- data ----
async function refresh(){
  state.vms = await api("GET","/api/vms");
  renderList();
  if(state.sel && state.view==="vm") await selectVM(state.sel,true);
}
function stateClass(s){return s==="running"?"running":(s==="paused"?"paused":"shut");}
function renderList(){
  const el=$("#vmlist");
  if(!state.vms.length){el.innerHTML='<div class="empty" style="padding:18px">No VMs</div>';return;}
  el.innerHTML = state.vms.map(v=>`
    <div class="vm ${v.name===state.sel&&state.view==='vm'?'sel':''}" onclick="selectVM('${esc(v.name)}')">
      <span class="dot ${stateClass(v.state)}"></span>
      <span class="nm">${esc(v.name)}</span>
      <span class="st">${esc(v.state)}</span>
    </div>`).join("");
}

async function selectVM(name, keepTab){
  state.sel=name; state.view="vm"; if(!keepTab) state.tab="overview";
  renderList();
  $("#main").innerHTML='<div class="empty"><span class="spin"></span> loading…</div>';
  state.detail = await api("GET","/api/vm/"+encodeURIComponent(name));
  renderVM();
}

// ---- VM view ----
function renderVM(){
  const d=state.detail||{};
  if(d.error){$("#main").innerHTML=`<div class="empty">${esc(d.error)}</div>`;return;}
  const running = d.state==="running";
  const tabs=["overview","hardware","snapshots"];
  $("#main").innerHTML=`
    <h2>${esc(d.name)} <span class="pill ${stateClass(d.state)}">${esc(d.state)}</span></h2>
    <p class="sub">${esc((d.description||"").split("\\n")[0])}</p>
    <div class="toolbar">
      <button class="pri" onclick="act('start')" ${running?"disabled":""}>▶ Start</button>
      <button onclick="act('shutdown')" ${running?"":"disabled"}>⏻ Shutdown</button>
      <button onclick="act('reboot')" ${running?"":"disabled"}>↻ Reboot</button>
      <button onclick="act('poweroff')" ${running?"":"disabled"}>⏹ Power off</button>
      <button onclick="openProvision()">⚙ Provision</button>
      <button onclick="openShare()">📁 Share</button>
      <button onclick="openRename()">✎ Rename</button>
      <button class="danger" onclick="openDelete()">🗑 Delete</button>
      <span style="width:1px;background:var(--line);align-self:stretch;margin:0 2px"></span>
      <button id="btnVpn" onclick="toggleNet('vpn')" title="OpenVPN client service">🔐 VPN …</button>
      <button id="btnKs" onclick="toggleNet('killswitch')" title="nftables VPN kill switch">🛡 Killswitch …</button>
    </div>
    <div class="tabs">${tabs.map(t=>`<div class="tab ${state.tab===t?'sel':''}" onclick="setTab('${t}')">${t[0].toUpperCase()+t.slice(1)}</div>`).join("")}</div>
    <div id="tabbody"></div>`;
  renderTab();
  state.net=null; renderNetButtons(); loadNet();
}

// ---- VPN / kill switch ----
async function loadNet(){
  state.net = await api("GET","/api/vm/"+encodeURIComponent(state.sel)+"/net");
  renderNetButtons();
}
function setToggle(btn,label,icon,st){
  if(!btn)return;
  const on = st==="active";
  btn.disabled=false;
  btn.textContent = icon+" "+label+": "+(st==="unknown"?"?":(on?"on":"off"));
  btn.classList.toggle("pri",on);
}
function renderNetButtons(){
  const bv=$("#btnVpn"), bk=$("#btnKs"); if(!bv||!bk)return;
  const n=state.net;
  if(!n){bv.textContent="🔐 VPN …";bk.textContent="🛡 Killswitch …";return;}
  if(!n.reachable){
    bv.textContent="🔐 VPN (VM offline)";bv.disabled=true;
    bk.textContent="🛡 Killswitch (VM offline)";bk.disabled=true;return;
  }
  setToggle(bv,"VPN","🔐",(n.vpn||{}).state);
  setToggle(bk,"Killswitch","🛡",(n.killswitch||{}).state);
}
async function toggleNet(which){
  const cur = (state.net && state.net[which] && state.net[which].state)==="active";
  const target = cur?"off":"on";
  if(which==="killswitch" && target==="on"){
    if(!confirm("Enable the kill switch?\\n\\nIt blocks all traffic that doesn't go through the VPN. If its rules also block the management LAN, you may lose SSH to this VM — and this panel's control over it — until it is lifted from the console."))return;
  }
  const btn = which==="vpn"?$("#btnVpn"):$("#btnKs");
  if(btn){btn.disabled=true;btn.textContent="…";}
  const r = await api("POST","/api/vm/"+encodeURIComponent(state.sel)+"/"+which,{state:target});
  toast(r.ok ? (which+" "+target+" ✓") : ("error: "+(r.output||r.error||"failed")));
  loadNet();
}
function setTab(t){state.tab=t;document.querySelectorAll(".tab").forEach(e=>e.classList.toggle("sel",e.textContent.toLowerCase()===t));renderTab();}

function renderTab(){
  const d=state.detail, b=$("#tabbody");
  if(state.tab==="overview"){
    const ms=d.memstat||{};
    b.innerHTML=`
      <div class="card"><h3>State</h3><div class="kv">
        <div class="k">State</div><div>${esc(d.state)}</div>
        <div class="k">vCPU</div><div>${esc(d.vcpu)}</div>
        <div class="k">Memory (max)</div><div>${esc(d.memoryMiB)} MiB</div>
        <div class="k">Memory (current)</div><div>${esc(d.currentMemoryMiB)} MiB</div>
        ${ms.available!=null?`<div class="k">Guest available</div><div>${(ms.available/1024|0)} MiB</div>`:""}
        <div class="k">Machine</div><div>${esc(d.machine)} / ${esc(d.arch)}</div>
      </div></div>
      <div class="card"><h3>Description &amp; worklog</h3><pre>${esc(d.description||"(none)")}</pre></div>`;
  } else if(state.tab==="hardware"){
    b.innerHTML=`
      <div class="card"><h3>CPU &amp; memory</h3>
        <div class="row"><label>vCPU</label><input id="cfgv" type="number" min="1" max="64" value="${esc(d.vcpu)}" style="width:90px">
          <label>Memory MiB</label><input id="cfgm" type="number" min="256" step="256" value="${esc(d.memoryMiB)}" style="width:120px">
          <button class="pri" onclick="applyConfig()">Apply</button></div>
        <div class="sub">CPU mode: ${esc(d.cpuMode)}. Raising above the boot-time maximum needs a redeploy (MEM=/VCPU=).</div>
      </div>
      <div class="card"><h3>Disks</h3><table><tr><th>Target</th><th>Bus</th><th>Type</th><th>Source</th></tr>
        ${(d.disks||[]).map(x=>`<tr><td>${esc(x.target)}</td><td>${esc(x.bus)}</td><td>${esc(x.device)}/${esc(x.driver)}</td><td><code>${esc(x.source)}</code></td></tr>`).join("")}</table></div>
      <div class="card"><h3>Network</h3><table><tr><th>Model</th><th>MAC</th><th>Network</th></tr>
        ${(d.nics||[]).map(x=>`<tr><td>${esc(x.model)}</td><td><code>${esc(x.mac)}</code></td><td>${esc(x.network)}</td></tr>`).join("")}</table></div>
      <div class="card"><h3>Shared folders (virtiofs)</h3>${(d.shares||[]).length?`<table><tr><th>Tag</th><th>Host source</th></tr>
        ${(d.shares||[]).map(x=>`<tr><td>${esc(x.tag)}</td><td><code>${esc(x.source)}</code></td></tr>`).join("")}</table>`:'<div class="sub">No virtiofs share.</div>'}
        <div class="row" style="margin-top:10px"><button onclick="openShare()">＋ Add share (live)</button></div></div>`;
  } else if(state.tab==="snapshots"){
    b.innerHTML=`<div class="card"><h3>Take a snapshot</h3>
        <div class="row"><input id="snapname" placeholder="snapshot name" value="clean"><button class="pri" onclick="takeSnap()">Snapshot</button></div></div>
      <div class="card"><h3>Snapshots</h3><div id="snaplist"><span class="spin"></span></div></div>`;
    loadSnaps();
  }
}

async function loadSnaps(){
  const s=await api("GET","/api/vm/"+encodeURIComponent(state.sel)+"/snapshots");
  const el=$("#snaplist");
  if(!s.length){el.innerHTML='<div class="sub">No snapshots.</div>';return;}
  el.innerHTML=`<table><tr><th>Name</th><th>State</th><th></th></tr>${s.map(x=>`
    <tr><td>${esc(x.name)} ${x.current?'<span class="pill">current</span>':''}</td><td>${esc(x.state)}</td>
      <td style="text-align:right">
        <button onclick="revertSnap('${esc(x.name)}')">Revert</button>
        <button class="danger" onclick="delSnap('${esc(x.name)}')">Delete</button></td></tr>`).join("")}</table>`;
}

// ---- actions ----
async function act(a){
  const r=await api("POST","/api/vm/"+encodeURIComponent(state.sel)+"/action",{action:a});
  toast(r.ok?a+" ok":("error: "+(r.output||r.error||"")));
  setTimeout(refresh,800);
}
async function applyConfig(){
  const body={memoryMiB:parseInt($("#cfgm").value,10), vcpu:parseInt($("#cfgv").value,10)};
  const r=await api("POST","/api/vm/"+encodeURIComponent(state.sel)+"/config",body);
  toast(r.ok?"config applied":("error: "+(r.output||r.error)));
  setTimeout(()=>selectVM(state.sel,true),500);
}
async function takeSnap(){
  const name=$("#snapname").value.trim(); if(!name)return;
  const r=await api("POST","/api/vm/"+encodeURIComponent(state.sel)+"/snapshot",{name});
  if(r.job){watchJob(r.job,"snapshot "+name);} else toast(r.error||"error");
}
async function revertSnap(n){
  if(!confirm("Revert "+state.sel+" to snapshot '"+n+"'? Current state is lost."))return;
  const r=await api("POST","/api/vm/"+encodeURIComponent(state.sel)+"/snapshot/"+encodeURIComponent(n)+"/revert");
  toast(r.ok?"reverted":("error: "+(r.output||r.error))); setTimeout(refresh,600);
}
async function delSnap(n){
  if(!confirm("Delete snapshot '"+n+"'?"))return;
  const r=await api("DELETE","/api/vm/"+encodeURIComponent(state.sel)+"/snapshot/"+encodeURIComponent(n));
  toast(r.ok?"deleted":("error")); loadSnaps();
}

// ---- dialogs ----
function openRename(){
  modal(`<h3>Rename / move ${esc(state.sel)}</h3>
    <div class="row"><label>New name</label><input id="rn" value="${esc(state.sel)}"></div>
    <div class="sub">Renames the libvirt domain (the VM must be shut off).</div>
    <div class="actions"><button onclick="closeModal()">Cancel</button>
      <button class="pri" onclick="doRename()">Rename</button></div>`);
}
async function doRename(){
  const nn=$("#rn").value.trim();
  const r=await api("POST","/api/vm/"+encodeURIComponent(state.sel)+"/rename",{newName:nn});
  closeModal(); if(r.ok){state.sel=nn;toast("renamed");refresh();}else toast("error: "+(r.output||r.error));
}
function openDelete(){
  modal(`<h3>Delete ${esc(state.sel)}</h3>
    <p class="sub">Choose how far to go. The persistent <code>&lt;vm&gt;-data.raw</code> disk is kept unless you destroy it.</p>
    <div class="row"><button class="danger" onclick="doMake('reset',{VM:state.sel},'reset '+state.sel)">Reset (undefine domain, keep /data)</button></div>
    <div class="row"><button class="danger" onclick="doMake('destroy',{VM:state.sel},'destroy '+state.sel)">Destroy (Terraform: remove VM + overlay)</button></div>
    <div class="actions"><button onclick="closeModal()">Cancel</button></div>`);
}
function openProvision(){
  api("GET","/api/profiles").then(ps=>{
    modal(`<h3>Provision ${esc(state.sel)}</h3>
      <div class="row"><label>Profile</label><select id="prof">${ps.map(p=>`<option>${esc(p)}</option>`).join("")}</select></div>
      <div class="sub">Runs <code>make provision VM=${esc(state.sel)} PROFILE=…</code> over SSH (Ansible). Idempotent &amp; additive.</div>
      <div class="actions"><button onclick="closeModal()">Cancel</button>
        <button class="pri" onclick="doMake('provision',{VM:state.sel,PROFILE:$('#prof').value},'provision '+state.sel)">Run</button></div>`);
  });
}
function openShare(){
  modal(`<h3>Share a host folder into ${esc(state.sel)} (live)</h3>
    <div class="row"><label>Host dir</label><input id="shdir" placeholder="/home/you/Documents/projet" style="flex:1"></div>
    <div class="row"><label>Mount point</label><input id="shdst" value="/mnt/host2"></div>
    <div class="row"><label>Tag</label><input id="shtag" placeholder="(auto from mount point)"></div>
    <div class="sub">Hot-attaches a virtiofs device without a reboot. Live-only — use SHARE2= at deploy to persist.</div>
    <div class="actions"><button onclick="closeModal()">Cancel</button>
      <button class="pri" onclick="doShare()">Share</button></div>`);
}
function doShare(){
  const vars={VM:state.sel, DIR:$("#shdir").value.trim(), DST:$("#shdst").value.trim()};
  const tag=$("#shtag").value.trim(); if(tag)vars.TAG=tag;
  if(!vars.DIR){toast("host dir required");return;}
  doMake("share",vars,"share "+state.sel);
}
function openNew(){
  api("GET","/api/profiles").then(ps=>{
    modal(`<h3>Create a VM</h3>
      <div class="row"><label>Name</label><input id="nvm" placeholder="lab01"></div>
      <div class="row"><label>Golden</label><input id="ngold" value="kali-desktop"></div>
      <div class="row"><label>Root GiB</label><input id="ndisk" type="number" value="50" style="width:100px"></div>
      <div class="row"><label>Mode</label>
        <select id="nmode">
          <option value="full">full (data disk + SPICE + full profile)</option>
          <option value="deploy">deploy (bare VM)</option>
        </select></div>
      <div class="row"><label>Shared dir</label><input id="nshare" placeholder="(optional host dir)" style="flex:1"></div>
      <div class="sub">full = <code>make full</code> (slow: deploy + provision). deploy = <code>make deploy</code>.</div>
      <div class="actions"><button onclick="closeModal()">Cancel</button>
        <button class="pri" onclick="doNew()">Create</button></div>`);
  });
}
function doNew(){
  const name=$("#nvm").value.trim(); if(!name){toast("name required");return;}
  const mode=$("#nmode").value;
  const vars={VM:name, GOLDEN:$("#ngold").value.trim(), DISK:$("#ndisk").value};
  const sh=$("#nshare").value.trim(); if(sh)vars.SHARE=sh;
  if(mode==="deploy"){vars.DATA="true";vars.SPICE="true";}
  doMake(mode,vars,mode+" "+name);
}

// ---- make jobs + console ----
async function doMake(target,vars,label){
  closeModal();
  const r=await api("POST","/api/make",{target,vars});
  if(r.job){watchJob(r.job,label||target);} else toast("error: "+(r.error||"could not start"));
}
function toggleConsole(){$("#con").classList.toggle("on");}
function watchJob(jid,label){
  $("#con").classList.add("on");
  $("#conTitle").textContent="Console — "+label;
  $("#conState").innerHTML='<span class="spin"></span> running';
  if(state.jobTimer)clearInterval(state.jobTimer);
  const poll=async()=>{
    const j=await api("GET","/api/jobs/"+jid);
    if(j.error){$("#conLog").textContent=j.error;clearInterval(state.jobTimer);return;}
    $("#conLog").textContent=j.output||"(no output yet)";
    $("#conLog").scrollTop=$("#conLog").scrollHeight;
    if(j.done){
      clearInterval(state.jobTimer);state.jobTimer=null;
      $("#conState").textContent = j.exit===0?"✓ done":("✗ exit "+j.exit);
      toast(label+(j.exit===0?" ✓":" failed")); refresh();
    }
  };
  poll(); state.jobTimer=setInterval(poll,1500);
}

// ---- profiles view ----
async function showProfiles(){
  state.view="profiles"; state.sel=null; renderList();
  const ps=await api("GET","/api/profiles");
  $("#main").innerHTML=`<h2>Profiles</h2><p class="sub">Ansible profiles in <code>provision/profiles/</code>. Edit &amp; save, then apply with Provision.</p>
    <div class="row"><label>Profile</label><select id="pfsel" onchange="loadProfile()">${ps.map(p=>`<option>${esc(p)}</option>`).join("")}</select>
      <button class="pri" onclick="saveProfile()">Save</button>
      <span id="pfmsg" class="sub"></span></div>
    <textarea id="pfbody" spellcheck="false"></textarea>`;
  if(ps.length)loadProfile();
}
async function loadProfile(){
  const n=$("#pfsel").value;
  const r=await api("GET","/api/profile/"+encodeURIComponent(n));
  $("#pfbody").value=r.content!=null?r.content:("# "+(r.error||"not found"));
}
async function saveProfile(){
  const n=$("#pfsel").value;
  const r=await api("PUT","/api/profile/"+encodeURIComponent(n),{content:$("#pfbody").value});
  $("#pfmsg").textContent=r.ok?"saved ✓":("error: "+(r.error||""));
  if(r.ok)setTimeout(()=>$("#pfmsg").textContent="",2000);
}

refresh();
setInterval(()=>{if(!state.jobTimer)refresh();},10000);
</script>
</body>
</html>
