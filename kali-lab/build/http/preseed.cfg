#### Localisation
d-i debian-installer/locale string en_US.UTF-8
d-i console-setup/ask_detect boolean false
d-i keyboard-configuration/xkb-keymap select us

#### Network
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string kali
d-i netcfg/get_domain string lab.local
d-i netcfg/hostname string kali

#### Kali mirror (Kali-specific) — verify against https://http.kali.org
d-i mirror/country string manual
d-i mirror/http/hostname string http.kali.org
d-i mirror/http/directory string /kali
d-i mirror/http/proxy string
d-i mirror/suite string kali-rolling

#### Accounts — non-root user 'kali' (Kali's modern default)
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Kali Lab
d-i passwd/username string kali
d-i passwd/user-password password kali
d-i passwd/user-password-again password kali
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home boolean false

#### Clock / timezone
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Paris
d-i clock-setup/ntp boolean true

#### Partitioning — single atomic layout on the virtio disk
d-i partman-auto/method string regular
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

#### Keep the base LEAN — no desktop, no default metapackage at install time.
#### Ansible installs the chosen metapackage afterwards.
tasksel tasksel/first multiselect
d-i pkgsel/include string openssh-server sudo python3 qemu-guest-agent
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false

#### Bootloader on the virtio disk
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string /dev/vda

d-i finish-install/reboot_in_progress note

#### Post-install:
####  * enable sshd — Kali ships openssh-server DISABLED by default
####    (kali-defaults preset), unlike Debian, so Packer cannot connect
####    unless we enable it here;
####  * passwordless sudo for 'kali' so Packer/Ansible run non-interactively.
d-i preseed/late_command string \
  in-target systemctl enable ssh; \
  in-target sh -c 'echo "kali ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/90-kali'; \
  in-target chmod 440 /etc/sudoers.d/90-kali
