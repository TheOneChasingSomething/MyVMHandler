# Active Directory attack profile — latest impacket / netexec / BloodHound.
#   make provision VM=<vm> PROFILE=ad
# Installs the fast-moving tools with pipx (isolated venvs, easy `pipx upgrade-all`)
# instead of the (often lagging) Kali apt packages. BloodHound CE (the server) is
# heavy (neo4j + postgres + UI) — left commented; run it on ONE box when needed.

min_free_gb: 5
min_free_path: /

apt_packages:
  - pipx
  - git
  - curl

run_commands:
  # Make ~/.local/bin (pipx) available in login shells.
  - cmd: "pipx ensurepath"
    become: false

  # impacket — latest from source (secretsdump.py, GetNPUsers.py, wmiexec.py, …)
  - cmd: "pipx install --force git+https://github.com/fortra/impacket.git"
    become: false
    creates: "/home/{{ ansible_user | default('kali') }}/.local/share/pipx/venvs/impacket"

  # netexec (nxc) — latest from source
  - cmd: "pipx install --force git+https://github.com/Pennyw0rth/NetExec.git"
    become: false
    creates: "/home/{{ ansible_user | default('kali') }}/.local/bin/nxc"

  # BloodHound Python collector (remote SharpHound-equivalent).
  # For BloodHound CE, use the CE-compatible collector branch instead:
  #   pipx install git+https://github.com/dirkjanm/BloodHound.py.git@bloodhound-ce
  - cmd: "pipx install --force bloodhound"
    become: false
    creates: "/home/{{ ansible_user | default('kali') }}/.local/bin/bloodhound-python"

