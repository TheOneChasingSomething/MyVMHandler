# V8 build profile — checks out and compiles V8 on the persistent /data disk.
#
# PREREQS (the /data disk must be mounted; create it at >= 40 GiB):
#   make data-create VM=v8 DATA_GB=40
#   make deploy      VM=v8 GOLDEN=kali-desktop DATA=true
#   make provision   VM=v8 PROFILE=v8            # this file (long: fetch + build)
# Already have a smaller /data? Grow it in place:  make data-resize VM=v8 DATA_GB=40
#
# NB on sizing: ext4 overhead + the 5% reserved blocks mean a nominal 30 GiB disk
# only exposes ~28 GiB free — so DATA_GB must exceed min_free_gb below by a few GiB.
# 40 GiB gives ~37 GiB free, a comfortable margin for a V8 checkout + d8 build.
#
# Everything lives under /data so it survives destroy/redeploy onto a newer golden.
# depot_tools + gclient run as the SSH user (never root); install-build-deps needs
# root and runs via sudo. Steps are guarded (creates:) so re-running resumes.

# Fail fast if the data disk is too small for a V8 checkout + build. Keep this a
# few GiB below the real disk size (see the ext4-overhead note above).
min_free_gb: 25
min_free_path: /data

# Minimal build deps for a headless d8 (x64.release). We deliberately do NOT rely
# on Chromium's install-build-deps.sh for these: that script validates its whole
# (GUI-heavy) list in one apt dry-run and aborts on a single obsolete name — on
# Kali that is `libfuse2` (time64 transition → libfuse2t64). V8 brings its own
# hermetic clang + sysroot, so d8 needs far less than full Chromium.
apt_packages:
  - git
  - curl
  - python3
  - python3-pip
  - lsb-release
  - xz-utils
  - pkg-config
  - build-essential        # host C/C++ toolchain
  - libglib2.0-dev
  - libatomic1
  - ca-certificates
  # NB: no fuse package here — d8 does not need it (fuse is for Chromium's
  # packaging/sandbox, not the V8 engine), and its name is unstable across Kali
  # releases (libfuse2 / libfuse2t64 / libfuse3-3). install-build-deps still asks
  # for it, which is exactly why that step is best-effort below.

# Give the SSH user ownership of the mounted data disk so it can check V8 out.
directories:
  - { path: /data, owner: kali, group: kali, mode: "0755" }

# depot_tools provides fetch / gclient / gn / ninja wrappers.
git_repos:
  - repo: https://chromium.googlesource.com/chromium/tools/depot_tools.git
    dest: /data/depot_tools
    become: false

# Make depot_tools available on PATH (login shells + the run_commands below).
env_path:
  - /data/depot_tools

run_commands:
  # 1) Fetch V8 (runs gclient sync with hooks). Long: several GiB.
  - cmd: "fetch v8"
    chdir: /data
    creates: /data/v8/.git
    become: false

  # 2) Install build dependencies (needs root). Best-effort: the core deps come
  # from apt_packages above (V8's hermetic toolchain covers the rest), so even if
  # Chromium's install-build-deps aborts on an obsolete package (e.g. libfuse2 on
  # Kali) we warn and carry on. The marker is always written so the step is
  # idempotent; the real test is whether step 3 (the build) succeeds.
  - cmd: >-
      ./build/install-build-deps.sh --no-prompt --unsupported ||
      echo "[warn] install-build-deps incomplete (e.g. libfuse2 obsolete on Kali) — relying on apt_packages + V8's hermetic toolchain" ;
      touch /data/v8/.deps-installed
    chdir: /data/v8
    creates: /data/v8/.deps-installed
    become: true

  # 3) Build the d8 shell in x64.release (gm.py drives gn + ninja). Long/CPU-heavy.
  - cmd: "tools/dev/gm.py x64.release d8"
    chdir: /data/v8
    creates: /data/v8/out/x64.release/d8
    become: false

# After it finishes:  /data/v8/out/x64.release/d8 --version
# Rebuild after edits:  cd /data/v8 && tools/dev/gm.py x64.release d8
