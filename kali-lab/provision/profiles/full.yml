# Full toolbox profile — everything from research + pentest + ad in one VM.
#   make provision VM=<vm> PROFILE=full
# Heavy: desktop dev tools + the offensive toolkit + AD tooling + Ghidra 12.0.4 +
# OpenCode + Claude Code, with Ghidra wired to OpenCode over MCP (ghidra-mcp).
# NOT included: the vulnerable targets (profile 'cibles' — run those on a separate
# VM) and the V8 build (profile 'v8' — special-purpose, needs /data). Give the VM
# room: DISK=40 (+ a golden baked with META=kali-linux-core to avoid duplication).

min_free_gb: 10
min_free_path: /

apt_packages:
  # dev / base
  - git
  - curl
  - pipx
  - python3-pip
  - openjdk-21-jdk        # Ghidra
  - awscli
  - wireshark
  - tmux
  - jq
  - maven                 # build the ghidra-mcp extension
  - unzip
  # recon / scanning
  - nmap
  - masscan
  - whatweb
  - dnsutils
  - amass
  # web / content discovery
  - gobuster
  - ffuf
  - feroxbuster
  - dirb
  - nikto
  - wpscan
  - sqlmap
  - wfuzz
  # smb / ad / network
  - netexec
  - enum4linux-ng
  - responder
  - smbclient
  - smbmap
  # password attacks
  - hydra
  - john
  - hashcat
  - seclists
  # frameworks / exploits
  - metasploit-framework
  - burpsuite
  - exploitdb

apt_repos:
  - name: vscode
    key_url: https://packages.microsoft.com/keys/microsoft.asc
    keyring: /etc/apt/keyrings/microsoft.gpg
    repo: "deb [arch=amd64,arm64,armhf signed-by=/etc/apt/keyrings/microsoft.gpg] https://packages.microsoft.com/repos/code stable main"
    packages:
      - code

# NB: Ghidra is NOT fetched via `downloads:` — the release asset's filename
# carries a per-build date stamp (ghidra_12.0.4_PUBLIC_<YYYYMMDD>.zip) that is
# painful to pin. It is resolved from the GitHub API and extracted in the first
# run_command below instead (version 12.0.4, to match the ghidra-mcp extension).

git_repos:
  - repo: https://github.com/swisskyrepo/PayloadsAllTheThings.git
    dest: /opt/PayloadsAllTheThings
    depth: 1
    become: true
  # Ghidra <-> OpenCode MCP bridge (community project — see the MCP doc).
  - repo: https://github.com/MIGINC/ghidra-mcp.git
    dest: /home/kali/tools/ghidra-mcp
    become: false
  # PromptScope — your own app, PUBLIC GitHub repo. Set the real URL and
  # uncomment; add its build step in the commented run_commands block below.
  #- repo: https://github.com/CHANGE_ME/PromptScope.git
  #  dest: /home/kali/tools/PromptScope
  #  become: false

# OpenCode config (multi-provider, NO secrets) dropped into the user's home.
# Keys are set per VM with `opencode auth login` (never committed).
directories:
  - { path: /home/kali/.config/opencode, owner: kali, group: kali, mode: "0755" }
  - { path: /home/kali/tools, owner: kali, group: kali, mode: "0755" }

host_binaries:
  - src: opencode.json            # resolved from provision/files/opencode.json
    dest: /home/kali/.config/opencode/opencode.json
    owner: kali
    group: kali
    mode: "0644"

run_commands:
  # Resolve + install Ghidra 12.0.4 from its GitHub release. The asset's date
  # stamp changes per patch build, so look the URL up via the API rather than
  # pinning a fragile filename. Idempotent: skipped once /opt/ghidra_*_PUBLIC exists.
  - cmd: >-
      ls -d /opt/ghidra_*_PUBLIC >/dev/null 2>&1 ||
      { url=$(curl -fsSL https://api.github.com/repos/NationalSecurityAgency/ghidra/releases/tags/Ghidra_12.0.4_build
      | grep -oE 'https://[^"]*ghidra_12\.0\.4_PUBLIC_[0-9]+\.zip' | head -1) ;
      [ -n "$url" ] || { echo 'cannot resolve the Ghidra 12.0.4 asset URL'; exit 1; } ;
      echo "downloading $url" ; curl -fsSL "$url" -o /tmp/ghidra.zip
      && unzip -q -o /tmp/ghidra.zip -d /opt && rm -f /tmp/ghidra.zip ; }
    become: true
  - cmd: "ln -sf /opt/ghidra_*/ghidraRun /usr/local/bin/ghidra"
    become: true
  - cmd: "pipx ensurepath"
    become: false
  - cmd: "curl -fsSL https://opencode.ai/install | bash"
    become: false
    creates: "/home/kali/.opencode/bin/opencode"
  # Claude Code (native installer; idempotent via the `command -v` guard).
  # Alternative if you prefer npm: `npm install -g @anthropic-ai/claude-code`
  # (needs Node.js >= 18 — add nodejs/npm to apt_packages in that case).
  - cmd: "command -v claude >/dev/null 2>&1 || curl -fsSL https://claude.ai/install.sh | bash"
    become: false
  - cmd: "pipx install --force git+https://github.com/fortra/impacket.git"
    become: false
    creates: "/home/kali/.local/share/pipx/venvs/impacket"
  - cmd: "pipx install --force git+https://github.com/Pennyw0rth/NetExec.git"
    become: false
    creates: "/home/kali/.local/bin/nxc"
  - cmd: "pipx install --force bloodhound"
    become: false
    creates: "/home/kali/.local/bin/bloodhound-python"
  # ---- Ghidra <-> OpenCode via MCP (per the MIGINC/ghidra-mcp README) --------
  # Validate the Ghidra path and install the extension's build prereqs (apt deps
  # need root). The ghidra path is resolved from the unarchived 12.0.4 directory.
  - cmd: "python3 -m tools.setup preflight --ghidra-path $(ls -d /opt/ghidra_*_PUBLIC | head -1) && python3 -m tools.setup ensure-prereqs --ghidra-path $(ls -d /opt/ghidra_*_PUBLIC | head -1) && touch /home/kali/.ghidra-mcp.prereqs"
    chdir: /home/kali/tools/ghidra-mcp
    become: true
    creates: /home/kali/.ghidra-mcp.prereqs
  # Build the extension and deploy it into the kali user's Ghidra profile. The
  # MCP bridge (bridge_mcp_ghidra.py) is then launched by OpenCode via the `mcp`
  # block in provision/files/opencode.json. Start the server inside Ghidra with
  # Tools -> GhidraMCP -> Start MCP Server (default port 8089), then `opencode mcp list`.
  - cmd: "python3 -m tools.setup build && python3 -m tools.setup deploy --ghidra-path $(ls -d /opt/ghidra_*_PUBLIC | head -1) && touch /home/kali/.ghidra-mcp.deployed"
    chdir: /home/kali/tools/ghidra-mcp
    become: false
    creates: /home/kali/.ghidra-mcp.deployed
  # ---- PromptScope (your app) — PUBLIC repo. Fill in and uncomment -----------
  # 1) uncomment the git_repos PromptScope entry above with the real URL;
  # 2) replace <BUILD/INSTALL CMD> with how PromptScope builds/installs, e.g.
  #    pipx install .  |  pip install -e .  |  npm ci && npm run build  |  make install
  #- cmd: "<BUILD/INSTALL CMD>"
  #  chdir: /home/kali/tools/PromptScope
  #  become: false
