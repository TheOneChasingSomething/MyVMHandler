# Vulnerable web targets profile — runs classic training apps in Docker.
# Deploy this on a SEPARATE VM from your attacker box (pentest profile) to mirror
# a real attacker -> target topology:
#   make deploy    VM=cibles GOLDEN=kali-desktop
#   make provision VM=cibles PROFILE=cibles
# Then reach them from the attacker VM / host at http://<cibles-ip>:<port>.

min_free_gb: 10
min_free_path: /

# Installing docker_run entries pulls in Docker automatically (see provision/site.yml).
docker_run:
  # DVWA — PHP/MySQL, simple graded vulnerabilities (login admin/password).
  - name: dvwa
    image: vulnerables/web-dvwa
    ports: ["8080:80"]
    restart: unless-stopped

  # OWASP WebGoat — Java, guided OWASP lessons.
  - name: webgoat
    image: webgoat/webgoat
    ports: ["8081:8080", "9090:9090"]
    restart: unless-stopped

  # OWASP Juice Shop — modern JS single-page app, OWASP flagship.
  - name: juice-shop
    image: bkimminich/juice-shop
    ports: ["3000:3000"]
    restart: unless-stopped

# Access (replace <ip> with `make ip VM=cibles`):
#   DVWA        http://<ip>:8080     (admin / password, then "Create / Reset Database")
#   WebGoat     http://<ip>:8081/WebGoat
#   Juice Shop  http://<ip>:3000
